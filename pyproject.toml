[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pygrametl"
authors = [{name = "Aalborg University", email = "pygrametl@cs.aau.dk"}]
urls = {Homepage = "http://pygrametl.org"}
description = "ETL programming in Python"
readme = {file = "README.rst", content-type = "text/x-rst"}
license = "BSD-2-Clause"
requires-python = ">= 3.4"
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.4",
    "Topic :: Database",
    "Topic :: Database :: Front-Ends",
    "Topic :: Software Development",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
]
dynamic = ["version"]
scripts = {dttr = "pygrametl.drawntabletesting.dttr:main"}

[tool.setuptools.dynamic]
version = {attr = "pygrametl.__version__"}

[tool.ruff.lint]
ignore = [
  "BLE001", "B017", "S110", # Support any RDBMS driver.
  #"DTZ001", "DTZ006", "DTZ005", "DTZ011", # Timezone.
  "N999", # Preserve module names for compatibility.
  "RUF012", "SIM115", # Changes make code more complex.
  "B026", "UP004", "UP028", "UP031", "UP032", "UP036", # Jython.
]
